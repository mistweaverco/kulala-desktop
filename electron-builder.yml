---
appId: app.kulala.desktop
productName: Kulala Desktop
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!dist/**"
  - "!tmp/**"
  - "!scripts/**"
  - "!resources/kulala-core/**"
  - "!**/node_modules/sqlite3/build-tmp-*/**"
asarUnpack:
  - resources/**
  - node_modules/sqlite3/**
extraResources:
  - from: resources/kulala-core
    to: kulala-core
    filter:
      - "**/*"
afterSign: scripts/notarize.js
win:
  executableName: kulala-desktop
  icon: build/icon.ico
nsis:
  artifactName: ${name}-setup_${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  notarize: false
  icon: build/icon.icns
  mergeASARs: true
  singleArchFiles: "**/*.node"
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${name}_${arch}.${ext}
  icon: build/icon.icns
linux:
  target:
    - AppImage
    - deb
  maintainer: kulala.mwco.app
  category: Utility
  icon: build/
appImage:
  artifactName: ${name}_${arch}.${ext}
deb:
  artifactName: ${name}_${arch}.${ext}
  compression: gz
npmRebuild: true
publish:
  provider: generic
  url: https://auto-updates.kulala.app/
